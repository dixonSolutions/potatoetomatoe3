name: Deploy GitHub Pages

# Download-site deploys are separate from platform builds.
# Release-triggered runs preserve the matching Flatpak OSTree when available.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release preparation
      - Publish Linux Flatpak
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site for GitHub Pages
        run: pnpm build
        env:
          NODE_ENV: production
          PUBLIC_PAGES_BASE: /potatoetomatoe3
          PUBLIC_OFFLINE_DEPLOYMENT: public-site
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional: Cloudflare Worker URL for Unity /api/unity-play (touch-injectable).
          # Set repo Actions variable PUBLIC_PLAY_PROXY_URL (no trailing slash).
          PUBLIC_PLAY_PROXY_URL: ${{ vars.PUBLIC_PLAY_PROXY_URL }}

      - name: Preserve matching Flatpak OSTree
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Publish Linux Flatpak'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: |
          set -uo pipefail
          mkdir -p build/flatpak
          RUN_ID="${RELEASE_RUN_ID}"
          echo "Downloading Flatpak artifact from platform run ${RUN_ID}"
          mkdir -p flatpak-artifacts
          if ! gh run download "${RUN_ID}" -n flatpak-bundle -D flatpak-artifacts; then
            echo "WARNING: artifact download failed — deploying web-only"
            exit 0
          fi
          if [ -d flatpak-artifacts/repo ]; then
            cp -a flatpak-artifacts/repo/. build/flatpak/
          else
            echo "WARNING: flatpak-artifacts/repo missing — deploying web-only"
            ls -la flatpak-artifacts || true
            exit 0
          fi
          if [ ! -f build/flatpak/summary ]; then
            echo "WARNING: restored tree missing summary — deploying web-only"
            ls -la build/flatpak || true
            exit 0
          fi
          echo "OK: preserved OSTree summary ($(wc -c < build/flatpak/summary) bytes)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
