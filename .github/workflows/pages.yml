name: Deploy GitHub Pages

# Fast web deploy on every main push, separate from Release/Flatpak.
# Preserves /flatpak/ OSTree from the currently published site so this
# workflow does not wipe remote Flatpak installs.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site for GitHub Pages
        run: pnpm build
        env:
          NODE_ENV: production
          PUBLIC_PAGES_BASE: /potatoetomatoe3
          PUBLIC_OFFLINE_DEPLOYMENT: public-site
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Preserve Flatpak OSTree from live Pages
        run: |
          set -euo pipefail
          BASE="https://dixonsolutions.github.io/potatoetomatoe3/flatpak"
          mkdir -p build/flatpak
          if curl -fsSIL "$BASE/summary" >/dev/null 2>&1; then
            echo "Mirroring existing OSTree from live Pages…"
            (
              cd build/flatpak
              wget -q -r -np -nH --cut-dirs=2 -R "index.html*" "$BASE/"
            )
            if [ ! -f build/flatpak/summary ]; then
              echo "ERROR: mirrored flatpak tree missing summary" >&2
              ls -la build/flatpak >&2 || true
              exit 1
            fi
            echo "OK: preserved OSTree summary ($(wc -c < build/flatpak/summary) bytes)"
          else
            echo "WARNING: no live /flatpak/summary — deploying web-only (remote Flatpak installs will break until Release finishes)"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
