name: Deploy GitHub Pages

# Download-site deploys are separate from platform builds.
# Release-triggered runs preserve the matching Flatpak OSTree when available.
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release preparation
      - Publish Linux Flatpak
    types:
      - completed

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Never cancel an in-flight Pages deploy that may be restoring OSTree.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site for GitHub Pages
        run: pnpm build
        env:
          NODE_ENV: production
          PUBLIC_PAGES_BASE: /potatoetomatoe3
          PUBLIC_OFFLINE_DEPLOYMENT: public-site
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Optional: Cloudflare Worker URL for Unity /api/unity-play (touch-injectable).
          # Set repo Actions variable PUBLIC_PLAY_PROXY_URL (no trailing slash).
          PUBLIC_PLAY_PROXY_URL: ${{ vars.PUBLIC_PLAY_PROXY_URL }}

      # Always try to keep a Flatpak OSTree on Pages. Release-prep deploys used to wipe
      # /flatpak when they raced ahead of Publish Linux Flatpak, breaking remotes.
      - name: Preserve Flatpak OSTree
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name || '' }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -uo pipefail
          mkdir -p build/flatpak flatpak-artifacts

          download_bundle() {
            local run_id="$1"
            [ -n "$run_id" ] || return 1
            rm -rf flatpak-artifacts
            mkdir -p flatpak-artifacts
            echo "Downloading flatpak-bundle from run ${run_id}"
            gh run download "${run_id}" -n flatpak-bundle -D flatpak-artifacts
          }

          RUN_ID=""
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_NAME" = "Publish Linux Flatpak" ]; then
            RUN_ID="$WORKFLOW_RUN_ID"
          fi

          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow=release-flatpak.yml --status=success --limit 20 --json databaseId,headSha --jq "[.[] | select(.headSha==\"$HEAD_SHA\")][0].databaseId // empty" || true)"
          fi

          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --repo "${{ github.repository }}" --workflow=release-flatpak.yml --status=success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
          fi

          if [ -z "$RUN_ID" ] || ! download_bundle "$RUN_ID"; then
            echo "WARNING: no Flatpak OSTree artifact available — deploying web-only"
            exit 0
          fi

          if [ -d flatpak-artifacts/repo ]; then
            cp -a flatpak-artifacts/repo/. build/flatpak/
          else
            echo "WARNING: flatpak-artifacts/repo missing — deploying web-only"
            ls -la flatpak-artifacts || true
            exit 0
          fi

          if [ ! -f build/flatpak/summary ]; then
            echo "WARNING: restored tree missing summary — deploying web-only"
            ls -la build/flatpak || true
            exit 0
          fi

          echo "OK: preserved OSTree summary ($(wc -c < build/flatpak/summary) bytes) from run ${RUN_ID}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
