name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  build-flatpak:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Restore Flatpak runtime and builder cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/ccache
            .flatpak-builder
          key: flatpak-gnome50-${{ runner.os }}-${{ hashFiles('flatpak/com.potatotomato.games.yml', 'flatpak/shared-modules/**') }}
          restore-keys: |
            flatpak-gnome50-${{ runner.os }}-

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev ccache

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = '$VERSION';
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version = \".*\"/m, 'version = \"$VERSION\"');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            fs.writeFileSync('version.txt', '$VERSION\n');
          "

      - name: Build puller sidecar
        run: |
          if ! (ldconfig -p | rg -q 'libnss3\.so' && ldconfig -p | rg -q 'libatk-1\.0\.so'); then
            (cd puller && npx playwright install-deps chromium)
          else
            echo "Playwright system dependencies already available"
          fi
          pnpm puller:bundle:linux

      - name: Build Tauri app
        run: pnpm tauri:build:flatpak

      - name: Assert Tauri catalog resources
        run: |
          # After `tauri build --no-bundle`, resources sit next to the binary
          # (not under target/lib/). Flatpak copies them into
          # `/app/lib/Potato Tomato/` (Tauri productName), with a potato-tomato symlink.
          CATALOG_LIST=src-tauri/target/release/catalog/games/games-list.json
          if [ ! -f "$CATALOG_LIST" ]; then
            echo "ERROR: missing $CATALOG_LIST after tauri build" >&2
            echo "Searched nearby games-list.json paths:" >&2
            find src-tauri/target -name 'games-list.json' 2>/dev/null | head -20 >&2 || true
            exit 1
          fi
          echo "OK: $CATALOG_LIST"

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --state-dir=.flatpak-builder --ccache \
            --repo=repo --default-branch=stable \
            build-flatpak flatpak/com.potatotomato.games.yml
          flatpak build-update-repo repo
          flatpak build-bundle repo "com.potatotomato.games-${{ needs.version.outputs.version }}.flatpak" \
            com.potatotomato.games stable

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: |
            com.potatotomato.games-*.flatpak
            repo/
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-flatpak, version]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ needs.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: dist/com.potatotomato.games-*.flatpak
