name: Release preparation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release target commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags

          target_sha=""
          while read -r sha; do
            if [ -z "$(git tag --points-at "$sha" --list 'release-[0-9]*')" ]; then
              target_sha="$sha"
              break
            fi
          done < <(git rev-list --reverse origin/main)

          if [ -z "$target_sha" ]; then
            echo "No untagged commits on main; nothing to release."
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_target=true" >> "$GITHUB_OUTPUT"

          if [ "$target_sha" != "${{ github.sha }}" ]; then
            echo "Delegating preparation to commit $target_sha (triggered by ${{ github.sha }})."
            gh workflow run release.yml --ref "$target_sha"
            exit 1
          fi

          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"
      - id: ver
        if: steps.target.outputs.has_target == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_tag="$(git tag --points-at HEAD --list 'release-[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$existing_tag" ]; then
            patch="${existing_tag#release-}"
          else
            latest_patch="$(git tag --list 'release-[0-9]*' | sed -n 's/^release-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)"
            patch="$(( ${latest_patch:-0} + 1 ))"
            existing_tag="release-$patch"
          fi
          [[ "$patch" =~ ^[0-9]+$ ]] || {
            echo "Invalid calculated release patch: $patch" >&2
            exit 1
          }
          echo "version=0.0.$patch" >> "$GITHUB_OUTPUT"
          echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.target.outputs.has_target == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v4
        if: steps.target.outputs.has_target == 'true'
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.target.outputs.has_target == 'true'
      - name: Stamp and validate shared release inputs
        if: steps.target.outputs.has_target == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          fs.writeFileSync('src-tauri/Cargo.toml', fs.readFileSync('src-tauri/Cargo.toml', 'utf8').replace(/^version = ".*"/m, `version = "${version}"`));
          NODE
          node scripts/verify-release-metadata.mjs "$VERSION" "$SHA"
      - name: Compile shared web and puller outputs
        if: steps.target.outputs.has_target == 'true'
        run: |
          pnpm build
          pnpm puller:build
      - name: Create or resume this tag's release
        if: steps.target.outputs.has_target == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          release_id="$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            gh release create "$TAG" --target "$SHA" --draft --title "Release $VERSION" --generate-notes
            release_id="$(gh release view "$TAG" --json id --jq .id)"
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Write immutable platform context
        if: steps.target.outputs.has_target == 'true'
        run: |
          cat > release-context.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "tag": "${{ steps.ver.outputs.tag }}",
            "sha": "${{ steps.ver.outputs.sha }}",
            "releaseId": "${{ steps.release.outputs.id }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        if: steps.target.outputs.has_target == 'true'
        with:
          name: release-inputs
          path: |
            release-context.json
            build/
            puller/dist/
          if-no-files-found: error
      - name: Continue release queue
        if: success() && steps.target.outputs.has_target == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags

          next_sha=""
          while read -r sha; do
            if [ -z "$(git tag --points-at "$sha" --list 'release-[0-9]*')" ]; then
              next_sha="$sha"
              break
            fi
          done < <(git rev-list --reverse origin/main)

          if [ -n "$next_sha" ]; then
            echo "Queueing preparation for $next_sha"
            gh workflow run release.yml --ref "$next_sha"
          fi
