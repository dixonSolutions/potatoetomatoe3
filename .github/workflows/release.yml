name: Release preparation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      sha: ${{ steps.ver.outputs.sha }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin --tags
          existing_tag="$(git tag --points-at HEAD --list 'release-[0-9]*' | sort -V | tail -n 1)"
          if [ -n "$existing_tag" ]; then
            patch="${existing_tag#release-}"
          else
            latest_patch="$(git tag --list 'release-[0-9]*' | sed -n 's/^release-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)"
            patch="$(( ${latest_patch:-0} + 1 ))"
            existing_tag="release-$patch"
            git -c user.name="Potato Tomato Release Bot" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$existing_tag" -m "Release 0.0.$patch" HEAD
            git push origin "$existing_tag"
          fi
          [[ "$patch" =~ ^[0-9]+$ ]] || {
            echo "Invalid calculated release patch: $patch" >&2
            exit 1
          }
          echo "version=0.0.$patch" >> "$GITHUB_OUTPUT"
          echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stamp and validate shared release inputs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          fs.writeFileSync('src-tauri/Cargo.toml', fs.readFileSync('src-tauri/Cargo.toml', 'utf8').replace(/^version = ".*"/m, `version = "${version}"`));
          NODE
          node scripts/verify-release-metadata.mjs "$VERSION" "$SHA"
      - name: Compile shared web and puller outputs
        env:
          PUBLIC_OFFLINE_DEPLOYMENT: local-app
        run: |
          pnpm build
          pnpm puller:build
      - name: Create or resume this tag's release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          release_id="$(gh release view "$TAG" --json id --jq .id 2>/dev/null || true)"
          if [ -z "$release_id" ]; then
            gh release create "$TAG" --target "$SHA" --draft --title "Release $VERSION" --generate-notes
            release_id="$(gh release view "$TAG" --json id --jq .id)"
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
      - name: Write immutable platform context
        run: |
          cat > release-context.json <<EOF
          {
            "version": "${{ steps.ver.outputs.version }}",
            "tag": "${{ steps.ver.outputs.tag }}",
            "sha": "${{ steps.ver.outputs.sha }}",
            "releaseId": "${{ steps.release.outputs.id }}"
          }
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-inputs
          path: |
            release-context.json
            build/
            puller/dist/
          if-no-files-found: error
