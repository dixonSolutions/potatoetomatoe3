name: Publish Android APK

on:
  workflow_run:
    workflows:
      - Release preparation
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-android-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-inputs
      - name: Restore prepared shared outputs
        run: |
          cp -a release-inputs/build/. build/
          cp -a release-inputs/puller/dist/. puller/dist/
      - name: Read immutable release identity
        id: release
        run: |
          echo "version=$(jq -r .version release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .sha release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The action's default is `tools platform-tools`, and `tools` is the long-obsolete
      # SDK Tools package Google has now dropped from the repository, so `sdkmanager
      # tools` exits 1 with "Failed to find package 'tools'" and takes the publish with
      # it. Nothing here wants it: the compiler pieces come from the sdkmanager call
      # below, and Gradle drives the build. Naming `packages` explicitly skips it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
      # The aarch64 build was recompiling every crate from scratch on every release
      # (~10 min of the APK step). `shared-key` keeps the entry off the job id so the
      # cache survives as a single stable entry rather than one per run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android-aarch64
          cache-on-failure: true
      - name: Install Android compiler dependencies
        run: |
          sdkmanager "platforms;android-36" "ndk;27.3.13750724"
          rustup target add aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - name: Stamp and validate this platform build
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          fs.writeFileSync('src-tauri/Cargo.toml', fs.readFileSync('src-tauri/Cargo.toml', 'utf8').replace(/^version = ".*"/m, `version = "${version}"`));
          NODE
          node scripts/verify-release-metadata.mjs "$VERSION" "$SHA"
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # An unsigned APK cannot be installed at all (INSTALL_PARSE_FAILED_NO_CERTIFICATES),
          # so a missing keystore must fail the build rather than publish a dead asset.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Publishing an unsigned APK produces an asset Android refuses to install. See docs/release.md." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/release.keystore
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=$(pwd)/src-tauri/gen/android/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      # `--apk` is a bare switch since tauri-cli 2.11; `--apk true` makes clap reject `true`
      # as a stray argument, which failed every APK publish from 0.0.90 on.
      - name: Build Android APK
        run: pnpm tauri android build --target aarch64 --apk
      - name: Collect versioned APK
        run: |
          mkdir -p dist
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' ! -name '*unsigned*' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::No signed release APK produced. Built artefacts:" >&2
            find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' >&2
            exit 1
          fi
          cp "$apk" "dist/potato-tomato-${{ steps.release.outputs.version }}.apk"
      - name: Verify the APK is signed
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --print-certs "dist/potato-tomato-${{ steps.release.outputs.version }}.apk"
      - name: Clean up signing material
        if: always()
        run: rm -f src-tauri/gen/android/release.keystore src-tauri/gen/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.release.outputs.version }}
          path: dist/*.apk
      - name: Attach Android asset to the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/*.apk --clobber
      # No wait-for-Flatpak poll here. `Publish Linux Flatpak` flips the same draft
      # with the same `gh release edit` at the end of its own job, so this job's copy
      # could only ever duplicate it — while burning 4-28 min of runner time per release
      # sleeping in a 30s poll loop (27.7 min on run 34927486726, where the APK had
      # already failed). The release still goes public exactly when Flatpak succeeds.

  andysu-live:
    concurrency:
      group: andysu-live-arm64
      cancel-in-progress: false
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check signing availability
        id: enabled
        env:
          SIGNING_KEY: ${{ secrets.ANDYSU_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo 'AndySU signing key absent; skipping live release'; fi
      - uses: actions/setup-java@v4
        if: steps.enabled.outputs.value == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.enabled.outputs.value == 'true'
        with:
          packages: platform-tools
      - uses: actions/download-artifact@v4
        if: steps.enabled.outputs.value == 'true'
        with:
          name: release-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-inputs
      - name: Read release identity
        if: steps.enabled.outputs.value == 'true'
        id: release
        run: |
          echo "version=$(jq -r .version release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.enabled.outputs.value == 'true'
        with:
          name: android-apk-${{ steps.release.outputs.version }}
          path: apk
      - name: Split signed APK with pinned AndySU
        if: steps.enabled.outputs.value == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS"
          base=https://github.com/dixonSolutions/AndySU/releases/download/v0.1.130
          curl -fsSL "$base/andysu-x86_64-unknown-linux-musl" -o "$RUNNER_TEMP/andysu"
          curl -fsSL "$base/andysu-host-template-0.1.130.zip" -o "$RUNNER_TEMP/host-template.zip"
          chmod +x "$RUNNER_TEMP/andysu"
          "$RUNNER_TEMP/andysu" host-config --toml andysu.toml --config-out "$RUNNER_TEMP/config.json" --host-out "$RUNNER_TEMP/host.json"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          "$RUNNER_TEMP/andysu" split "apk/potato-tomato-$VERSION.apk" --out split --transparent --abi arm64-v8a --version "$VERSION" --host-api 3 \
            --host-template "$RUNNER_TEMP/host-template.zip" --config "$RUNNER_TEMP/config.json" \
            --keystore "$RUNNER_TEMP/release.keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-alias "$ANDROID_KEY_ALIAS"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n1)"
          plain_code=$("$aapt" dump badging "apk/potato-tomato-$VERSION.apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          host_code=$("$aapt" dump badging split/host.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          test -n "$plain_code" && test -n "$host_code" && test "$host_code" -ge "$plain_code"
      - name: Refuse to republish an older app release
        if: steps.enabled.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' | sed -n 's/^release-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)
          test "release-$newest" = "$TAG"
      - name: Check whether payload is published
        if: steps.enabled.outputs.value == 'true'
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "andysu-live-arm64-$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo 'exists=true' >> "$GITHUB_OUTPUT"; fi
      - name: Publish signed channel
        if: steps.enabled.outputs.value == 'true' && steps.published.outputs.exists != 'true'
        uses: dixonSolutions/AndySU/actions/publish@v0.1.130
        with:
          payload: split/payload
          config: andysu.toml
          signing-key: ${{ secrets.ANDYSU_SIGNING_KEY }}
          signing-cert: ${{ secrets.ANDYSU_SIGNING_CERT }}
          version: ${{ steps.release.outputs.version }}
          pack-args: --no-rename
          andysu-version: 0.1.130
      - name: Attach live APK
        if: steps.enabled.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cp split/host.apk "PT3-live-$VERSION-arm64.apk"
          gh release upload "$TAG" "PT3-live-$VERSION-arm64.apk" --clobber
