name: Publish Android APK

on:
  workflow_run:
    workflows:
      - Release preparation
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-android-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: release-inputs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: release-inputs
      - name: Restore prepared shared outputs
        run: |
          cp -a release-inputs/build/. build/
          cp -a release-inputs/puller/dist/. puller/dist/
      - name: Read immutable release identity
        id: release
        run: |
          echo "version=$(jq -r .version release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .sha release-inputs/release-context.json)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android compiler dependencies
        run: |
          sdkmanager "platforms;android-36" "ndk;27.3.13750724"
          rustup target add aarch64-linux-android
      - run: pnpm install --frozen-lockfile
      - name: Stamp and validate this platform build
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
          }
          fs.writeFileSync('src-tauri/Cargo.toml', fs.readFileSync('src-tauri/Cargo.toml', 'utf8').replace(/^version = ".*"/m, `version = "${version}"`));
          NODE
          node scripts/verify-release-metadata.mjs "$VERSION" "$SHA"
      - name: Build Android APK
        run: pnpm tauri android build --target aarch64 --apk true
      - name: Collect versioned APK
        run: |
          mkdir -p dist
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} "dist/potato-tomato-${{ steps.release.outputs.version }}.apk" \;
          test -f "dist/potato-tomato-${{ steps.release.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ steps.release.outputs.version }}
          path: dist/*.apk
      - name: Attach Android asset to the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" dist/*.apk --clobber
      - name: Wait for Linux Flatpak assets
        if: always() && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          for _ in $(seq 1 180); do
            read -r status conclusion < <(gh run list --repo "${{ github.repository }}" --workflow=release-flatpak.yml --commit="$SHA" --limit 1 --json status,conclusion --jq -r '.[0] | "\(.status) \(.conclusion // "")"')
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || exit 0
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Publish Linux Flatpak" >&2
          exit 1
      - name: Publish release
        if: always() && steps.release.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          conclusion="$(gh run list --repo "${{ github.repository }}" --workflow=release-flatpak.yml --commit="$SHA" --limit 1 --json conclusion --jq -r '.[0].conclusion // ""')"
          [ "$conclusion" = "success" ] || exit 0
          gh release edit "$TAG" --draft=false --latest
