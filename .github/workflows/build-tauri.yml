name: Build Flatpak

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Restore Flatpak runtime and builder cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/ccache
            .flatpak-builder
          key: flatpak-gnome50-${{ runner.os }}-${{ hashFiles('flatpak/com.potatotomato.games.yml', 'flatpak/shared-modules/**') }}
          restore-keys: |
            flatpak-gnome50-${{ runner.os }}-

      - name: Restore packaging and Playwright caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.pkg-cache
            ~/.cache/pkg-native
            ~/.cache/ms-playwright
          key: native-tools-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'puller/package.json') }}
          restore-keys: |
            native-tools-${{ runner.os }}-node22-

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak flatpak-builder \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev ccache
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build app binaries
        run: |
          pnpm install --frozen-lockfile
          if ! (ldconfig -p | grep -q 'libnss3\.so' && ldconfig -p | grep -q 'libatk-1\.0\.so'); then
            (cd puller && npx playwright install-deps chromium)
          else
            echo "Playwright system dependencies already available"
          fi
          pnpm puller:bundle:linux
          pnpm tauri:build:flatpak
          test -x src-tauri/target/release/potato-tomato

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --state-dir=.flatpak-builder --ccache \
            --repo=repo --default-branch=stable \
            build-flatpak flatpak/com.potatotomato.games.yml
          # Absolute paths: pnpm --filter runs smoke from puller/, so relative
          # build-flatpak/... would resolve to the wrong directory.
          SOURCE_SIDECAR="$PWD/src-tauri/binaries/puller-sidecar-x86_64-unknown-linux-gnu"
          ASSEMBLED_SIDECAR="$PWD/build-flatpak/files/bin/puller-sidecar"
          test -x "$ASSEMBLED_SIDECAR" || {
            echo "ERROR: assembled sidecar missing at $ASSEMBLED_SIDECAR" >&2
            find build-flatpak -name 'puller-sidecar*' 2>/dev/null | head -20 >&2 || true
            exit 1
          }
          cmp "$SOURCE_SIDECAR" "$ASSEMBLED_SIDECAR"
          PULLER_BINARY="$ASSEMBLED_SIDECAR" pnpm --filter @potatotomato/puller smoke:bundle
          flatpak build-bundle repo potato-tomato.flatpak com.potatotomato.games stable

      - uses: actions/upload-artifact@v4
        with:
          name: potato-tomato-flatpak
          path: potato-tomato.flatpak
          if-no-files-found: error
