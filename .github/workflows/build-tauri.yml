name: Build Flatpak

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A 20-minute Flatpak build per push meant three pushes to a PR occupied three runners
# to produce two results nobody reads.
concurrency:
  group: build-flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Restore Flatpak runtime and builder cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/flatpak
            ~/.cache/ccache
            .flatpak-builder
          key: flatpak-gnome50-${{ runner.os }}-${{ hashFiles('flatpak/com.potatotomato.games.yml', 'flatpak/shared-modules/**') }}
          restore-keys: |
            flatpak-gnome50-${{ runner.os }}-

      - name: Restore packaging and Playwright caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.pkg-cache
            ~/.cache/pkg-native
            ~/.cache/ms-playwright
          key: native-tools-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            native-tools-${{ runner.os }}-node22-

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flatpak flatpak-builder \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            pkg-config libssl-dev ccache
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - uses: dtolnay/rust-toolchain@stable

      # `shared-key` must match release-flatpak.yml. Swatinem keys on the job id by
      # default, so this job looked for `v0-rust-build-flatpak-*` while the only cache
      # main ever saved was `v0-rust-publish-*` — a guaranteed miss, and a full 9-minute
      # cold `cargo build --release` on every PR.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: flatpak-linux
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build app binaries
        run: |
          pnpm install --frozen-lockfile
          scripts/test-andysu-release.sh
          pnpm tauri:build:flatpak
          test -x src-tauri/target/release/potato-tomato

      - name: Build Flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --state-dir=.flatpak-builder --ccache \
            --repo=repo --default-branch=stable \
            build-flatpak flatpak/com.potatotomato.games.yml
          flatpak build-bundle repo potato-tomato.flatpak com.potatotomato.games stable

      - uses: actions/upload-artifact@v4
        with:
          name: potato-tomato-flatpak
          path: potato-tomato.flatpak
          if-no-files-found: error
