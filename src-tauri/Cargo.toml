[package]
name = "potato-tomato"
version = "0.0.1"
description = "Your ultimate destination for unblocked games"
authors = ["luohoa97", "radr40662@gmail.com"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "potato-tomato"
path = "src/main.rs"

[lib]
name = "potato_tomato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Build the full-speed GIO module (`gio/`, see build.rs) against the system GLib on Linux.
# Both are already in the graph (ring, system-deps), so this adds no crate.
cc = "1"
pkg-config = "0.3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `image-png` lets the privacy disguise turn the PNG the WebView rasterised into a
# window/tray icon; without it `Image::from_bytes` is not compiled in.
# 2.11.5 is a floor, not a preference: it brings wry 0.55, which scales the base colour
# into `GdkRGBA`'s 0.0–1.0 range. Below it every non-black background clamps to white and
# the launch flash comes back. Keep the major/minor in step with `@tauri-apps/api` in
# package.json, or `tauri build` refuses to start on the version mismatch.
tauri = { version = "2.11.5", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# APK self-update: stream the release asset to disk with progress rather than handing
# the URL to a browser. rustls avoids dragging in OpenSSL for the Android cross-build.
# `rustls-tls-native-roots` adds the OS trust store to the bundled roots, for the game relay
# (`relay.rs`): a school network that re-signs TLS with its own root CA has that CA installed
# on its machines, and nowhere in webpki-roots.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "rustls-tls-native-roots",
  "stream"
] }
futures-util = "0.3"
# Disguise icons cross the IPC boundary as base64 PNG (a raw RGBA array would be ~1 MB of JSON).
base64 = "0.22"
tokio = { version = "1", features = ["fs", "io-util"] }
# The offline-copy HTML fixes the puller used to apply (`offline_games.rs`); already in the
# graph through Tauri.
regex = "1"

# `gtk::Settings` + the appearance portal, so the webview is told the desktop's real
# light/dark choice rather than what the GTK theme name implies. Same 0.18 Tauri already
# builds on Linux, so this adds a name in scope, not a crate to the graph.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The WebKitGTK handle behind Tauri's webview, to swap the game-frame user script per
# launch (`game_frames.rs`). Pinned to what wry already builds with, so it adds no crate.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

# Firing the package-installer Intent needs a JNI hop into MainActivity; there is no
# portable Tauri API for "open this content:// with an explicit MIME type".
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
