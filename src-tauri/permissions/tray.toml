[[permission]]
identifier = "allow-sync-tray-recent"
description = "Allow the frontend to update the system tray recent-games menu"
commands.allow = ["sync_tray_recent"]

[[permission]]
identifier = "allow-get-puller-base-url"
description = "Allow the frontend to read the local puller HTTP base URL"
commands.allow = ["get_puller_base_url"]

[[permission]]
identifier = "allow-ensure-puller"
description = "Allow the frontend to check for, and start on demand, the local puller (offline downloads)"
commands.allow = ["ensure_puller", "puller_running"]

[[permission]]
identifier = "allow-get-dev-harness-mode"
description = "Allow the frontend to read the active development harness mode (debug builds only)"
commands.allow = ["get_dev_harness_mode"]

[[permission]]
identifier = "allow-tray-lifecycle"
description = "Allow the frontend to query tray availability and quit the desktop app"
commands.allow = ["is_tray_available", "is_close_to_tray_enabled", "set_close_to_tray_enabled", "quit_app"]

[[permission]]
identifier = "allow-open-external-url"
description = "Allow the frontend to hand an https URL to the OS (Android ACTION_VIEW / desktop default handler)"
commands.allow = ["open_external_url"]

[[permission]]
identifier = "allow-apk-self-update"
description = "Allow the frontend to download a verified release APK and hand it to the Android package installer"
commands.allow = ["download_and_install_apk", "can_install_apk", "open_install_permission_settings"]

[[permission]]
identifier = "allow-native-identity"
description = "Allow the frontend to mirror the privacy disguise onto the native window/task label and icon"
commands.allow = ["native_identity_target", "set_native_disguise", "clear_native_disguise"]

[[permission]]
identifier = "allow-game-frames"
description = "Allow the frontend to install the in-frame game bridge for the game it is launching"
commands.allow = ["native_game_frames_supported", "set_game_frame_context", "clear_game_frame_context"]

[[permission]]
identifier = "allow-offline-files"
description = "Allow the frontend to read offline copies and per-game saves from the app's games folder"
commands.allow = ["offline_statuses", "offline_entry", "offline_delete", "game_profile_read", "game_profile_write", "game_profile_delete"]

[[permission]]
identifier = "allow-webview-crash"
description = "Allow the reloaded page to learn that the web process crashed (and, in debug builds, to crash it on purpose)"
commands.allow = ["take_webview_crash", "debug_crash_webview"]
