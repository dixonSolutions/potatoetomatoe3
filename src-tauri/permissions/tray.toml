[[permission]]
identifier = "allow-sync-tray-recent"
description = "Allow the frontend to update the system tray recent-games menu"
commands.allow = ["sync_tray_recent"]

[[permission]]
identifier = "allow-get-puller-base-url"
description = "Allow the frontend to read the local puller HTTP base URL"
commands.allow = ["get_puller_base_url"]

[[permission]]
identifier = "allow-ensure-puller"
description = "Allow the frontend to health-check and respawn the local puller sidecar"
commands.allow = ["ensure_puller"]

[[permission]]
identifier = "allow-get-dev-harness-mode"
description = "Allow the frontend to read the active development harness mode (debug builds only)"
commands.allow = ["get_dev_harness_mode"]

[[permission]]
identifier = "allow-tray-lifecycle"
description = "Allow the frontend to query tray availability and quit the desktop app"
commands.allow = ["is_tray_available", "is_close_to_tray_enabled", "set_close_to_tray_enabled", "quit_app"]

[[permission]]
identifier = "allow-open-external-url"
description = "Allow the frontend to hand an https URL to the OS (Android ACTION_VIEW / desktop default handler)"
commands.allow = ["open_external_url"]

[[permission]]
identifier = "allow-apk-self-update"
description = "Allow the frontend to download a verified release APK and hand it to the Android package installer"
commands.allow = ["download_and_install_apk", "can_install_apk", "open_install_permission_settings"]
