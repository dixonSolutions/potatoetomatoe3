<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="700" fill="#0d0f1a"/>

  <!-- Title -->
  <text x="30" y="40" fill="#ffffff" font-size="24" font-weight="bold">Universal Touch Console — Overlay Layout (Landscape)</text>

  <!-- Phone / game frame -->
  <rect x="40" y="70" width="820" height="480" rx="24" fill="#1a1a2e" stroke="#4a4a6a" stroke-width="4"/>
  <text x="450" y="310" fill="#3a3a55" font-size="20" text-anchor="middle">GAME (iframe, same-origin)</text>

  <!-- 5-finger toggle gesture illustration -->
  <g opacity="0.55">
    <circle cx="300" cy="180" r="12" fill="#ffcc00"/>
    <circle cx="340" cy="160" r="12" fill="#ffcc00"/>
    <circle cx="380" cy="155" r="12" fill="#ffcc00"/>
    <circle cx="420" cy="165" r="12" fill="#ffcc00"/>
    <circle cx="455" cy="190" r="12" fill="#ffcc00"/>
  </g>
  <circle cx="375" cy="175" r="110" fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="720" cy="110" r="16" fill="#ffcc00"/>
  <text x="740" y="116" fill="#ffcc00" font-size="18" font-weight="bold">1</text>

  <!-- Joystick -->
  <circle cx="160" cy="440" r="75" fill="#ffffff" opacity="0.15" stroke="#ffffff" stroke-width="2"/>
  <circle cx="185" cy="420" r="34" fill="#ffffff" opacity="0.55"/>
  <circle cx="160" cy="440" r="16" fill="#ffcc00"/>
  <text x="152" y="446" fill="#000" font-size="18" font-weight="bold">2</text>

  <!-- Hold-2s / drag indicator on joystick -->
  <circle cx="160" cy="440" r="95" fill="none" stroke="#ff5566" stroke-width="2" stroke-dasharray="4,5"/>
  <path d="M255,440 Q300,380 350,420" fill="none" stroke="#ff5566" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <circle cx="360" cy="425" r="16" fill="#ff5566"/>
  <text x="352" y="431" fill="#000" font-size="18" font-weight="bold">3</text>

  <!-- Action buttons -->
  <circle cx="700" cy="400" r="38" fill="#4ade80" opacity="0.5" stroke="#4ade80" stroke-width="2"/>
  <text x="690" y="408" fill="#fff" font-size="18">A</text>
  <circle cx="770" cy="440" r="38" fill="#60a5fa" opacity="0.5" stroke="#60a5fa" stroke-width="2"/>
  <text x="760" y="448" fill="#fff" font-size="18">B</text>
  <circle cx="815" cy="380" r="16" fill="#ffcc00"/>
  <text x="807" y="386" fill="#000" font-size="18" font-weight="bold">4</text>

  <!-- Manual toggle button -->
  <rect x="770" y="90" width="60" height="60" rx="14" fill="#ffffff" opacity="0.2" stroke="#ffffff" stroke-width="2"/>
  <text x="785" y="128" fill="#ffffff" font-size="24">⏻</text>
  <circle cx="850" cy="95" r="16" fill="#ffcc00"/>
  <text x="842" y="101" fill="#000" font-size="18" font-weight="bold">5</text>

  <!-- Settings gear -->
  <text x="70" y="130" fill="#ffffff" font-size="30">⚙</text>
  <circle cx="105" cy="105" r="16" fill="#ffcc00"/>
  <text x="97" y="111" fill="#000" font-size="18" font-weight="bold">6</text>

  <!-- Orientation icon -->
  <text x="700" y="130" fill="#ffffff" font-size="26">⟳</text>
  <circle cx="730" cy="105" r="16" fill="#ffcc00"/>
  <text x="722" y="111" fill="#000" font-size="18" font-weight="bold">7</text>

  <!-- Size slider illustration near joystick -->
  <circle cx="160" cy="560" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="160" cy="560" r="24" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="160" cy="560" r="36" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="560" r="16" fill="#ffcc00"/>
  <text x="192" y="566" fill="#000" font-size="18" font-weight="bold">8</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff5566"/>
    </marker>
  </defs>

  <!-- Legend panel -->
  <rect x="880" y="70" width="290" height="480" rx="12" fill="#161826" stroke="#333" stroke-width="1"/>
  <text x="900" y="100" fill="#ffcc00" font-size="18" font-weight="bold">Legend</text>

  <text x="900" y="135" fill="#fff" font-size="14" font-weight="bold">1  Five-finger toggle zone</text>
  <text x="900" y="153" fill="#aaa" font-size="12">5 simultaneous touches show/hide overlay</text>

  <text x="900" y="180" fill="#fff" font-size="14" font-weight="bold">2  Virtual joystick</text>
  <text x="900" y="198" fill="#aaa" font-size="12">Directional input → mapped keys</text>

  <text x="900" y="225" fill="#fff" font-size="14" font-weight="bold">3  Hold-2s reposition mode</text>
  <text x="900" y="243" fill="#aaa" font-size="12">Long-press a control, then drag to move it</text>

  <text x="900" y="270" fill="#fff" font-size="14" font-weight="bold">4  Action buttons (A/B)</text>
  <text x="900" y="288" fill="#aaa" font-size="12">Tap → mapped key/click event</text>

  <text x="900" y="315" fill="#fff" font-size="14" font-weight="bold">5  Manual toggle button</text>
  <text x="900" y="333" fill="#aaa" font-size="12">Same show/hide as the 5-finger gesture</text>

  <text x="900" y="360" fill="#fff" font-size="14" font-weight="bold">6  Settings entry point</text>
  <text x="900" y="378" fill="#aaa" font-size="12">Opens layout editor (size/position/opacity)</text>

  <text x="900" y="405" fill="#fff" font-size="14" font-weight="bold">7  Orientation profile</text>
  <text x="900" y="423" fill="#aaa" font-size="12">Switches landscape/portrait layout set</text>

  <text x="900" y="450" fill="#fff" font-size="14" font-weight="bold">8  Size adjustment</text>
  <text x="900" y="468" fill="#aaa" font-size="12">Per-control scale, set in Settings</text>

  <text x="900" y="500" fill="#666" font-size="11">Note: all input events are dispatched</text>
  <text x="900" y="516" fill="#666" font-size="11">only into iframe.contentDocument —</text>
  <text x="900" y="532" fill="#666" font-size="11">never the parent app window.</text>

</svg>
