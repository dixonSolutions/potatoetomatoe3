<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compact Game Page — Potato Tomato Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }
  .phone {
    width: 390px;
    background: #0a0a0a;
    border: 1px solid #232323;
    border-radius: 28px;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid #1c1c1c;
  }
  .back-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: #161616;
    border: 1px solid #262626;
    color: #f5f5f5;
    font-size: 16px;
    flex-shrink: 0;
  }
  .logo { font-size: 18px; flex-shrink: 0; }
  header .title { font-weight: 700; font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    background: #161616;
    border: 1px solid #262626;
    color: #f5f5f5;
    font-size: 16px;
    flex-shrink: 0;
  }

  .content { padding: 18px 16px 24px; }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.15; margin-bottom: 4px; }
  .by { color: #8a8a8a; font-size: 13px; margin-bottom: 18px; }

  .play-btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, #ff6b4a, #ff3b30);
    border: none;
    color: white;
    font-size: 17px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(255, 59, 48, 0.25);
  }

  .segmented {
    display: flex;
    background: #131313;
    border: 1px solid #232323;
    border-radius: 12px;
    padding: 3px;
    margin-bottom: 16px;
  }
  .segmented button {
    flex: 1;
    padding: 8px;
    border: none;
    background: transparent;
    color: #8a8a8a;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: 9px;
  }
  .segmented button.active { background: #262626; color: #fff; }

  .action-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .action-item {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px;
    border-radius: 12px;
    background: #131313;
    border: 1px solid #232323;
  }
  .action-item.liked { border-color: #4ade8055; background: #4ade8014; }
  .action-item .ic { font-size: 17px; }
  .action-item .lb { font-size: 9.5px; color: #9a9a9a; text-align: center; line-height: 1.1; }

  .accordion {
    border: 1px solid #232323;
    border-radius: 14px;
    overflow: hidden;
  }
  .accordion summary {
    padding: 13px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: #d5d5d5;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
    list-style: none;
  }
  .accordion summary::-webkit-details-marker { display: none; }
  .accordion summary .chev { color: #666; transition: transform 0.2s; }
  .accordion[open] summary .chev { transform: rotate(90deg); }
  .accordion-body {
    padding: 0 14px 14px;
    font-size: 12px;
    color: #8a8a8a;
  }
  .accordion-body .storage-chip {
    display: inline-block;
    padding: 5px 10px;
    background: #1a1a1a;
    border: 1px solid #262626;
    border-radius: 8px;
    font-size: 11px;
    margin-bottom: 10px;
  }
  .accordion-body .dl-btn {
    width: 100%;
    padding: 11px;
    background: #f5f5f5;
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 13px;
  }

  .note {
    margin-top: 14px;
    font-size: 10.5px;
    color: #555;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="phone">
    <header>
      <div class="back-btn">←</div>
      <div class="logo">🥔🍅</div>
      <div class="title">A Dance Of Fire And Ice</div>
      <div class="icon-btn">⚙</div>
    </header>

    <div class="content">
      <h1>A Dance Of Fire And Ice</h1>
      <div class="by">By Ported</div>

      <button class="play-btn">▶ Play Now</button>

      <div class="segmented">
        <button class="active">🌐 Online</button>
        <button>📥 Offline</button>
      </div>

      <div class="action-grid">
        <div class="action-item liked">
          <span class="ic">👍</span>
          <span class="lb">Favourite</span>
        </div>
        <div class="action-item">
          <span class="ic">👎</span>
          <span class="lb">Dislike</span>
        </div>
        <div class="action-item">
          <span class="ic">📜</span>
          <span class="lb">Logs</span>
        </div>
        <div class="action-item">
          <span class="ic">↻</span>
          <span class="lb">Relaunch</span>
        </div>
        <div class="action-item">
          <span class="ic">⛶</span>
          <span class="lb">Fullscreen</span>
        </div>
      </div>

      <details class="accordion">
        <summary>
          <span>Download for offline</span>
          <span class="chev">›</span>
        </summary>
        <div class="accordion-body">
          <div class="storage-chip">Browser storage (IndexedDB)</div>
          <button class="dl-btn">⭳ Download for offline</button>
        </div>
      </details>

      <div class="note">Pause appears here only once the game is running.</div>
    </div>
  </div>
</body>
</html>
