<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#2b2f5e"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </radialGradient>
    <radialGradient id="stickGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(160,180,255,0.35)"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="blurred"><feGaussianBlur stdDeviation="14"/></filter>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff5566"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#05060c"/>
  <text x="30" y="40" fill="#ffffff" font-size="22" font-weight="bold">Compact Glass Console — Single-Rectangle Default (Landscape)</text>

  <!-- Game frame -->
  <rect x="40" y="70" width="820" height="480" rx="20" fill="url(#bgGrad)" stroke="#4a4a6a" stroke-width="3"/>
  <text x="450" y="120" fill="#4a4d75" font-size="16" text-anchor="middle">GAME (iframe, same-origin)</text>
  <!-- colorful blobs behind glass panel to sell the frosted effect -->
  <circle cx="230" cy="470" r="90" fill="#8b5cf6" filter="url(#blurred)" opacity="0.5"/>
  <circle cx="330" cy="410" r="70" fill="#38bdf8" filter="url(#blurred)" opacity="0.4"/>

  <!-- ==== Compact console rectangle ==== -->
  <rect x="70" y="330" width="380" height="180" rx="26" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Drag handle (whole-console reposition) -->
  <rect x="230" y="340" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <circle cx="300" cy="344" r="14" fill="#ffcc00"/>
  <text x="294" y="349" fill="#000" font-size="14" font-weight="bold">1</text>

  <!-- Glass joystick -->
  <circle cx="160" cy="450" r="62" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="176" cy="435" r="30" fill="url(#stickGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
  <circle cx="115" cy="405" r="14" fill="#ffcc00"/>
  <text x="109" y="410" fill="#000" font-size="14" font-weight="bold">2</text>

  <!-- Action buttons, grouped tight (compact) -->
  <circle cx="345" cy="420" r="26" fill="rgba(74,222,128,0.25)" stroke="#4ade80" stroke-width="1.5"/>
  <text x="337" y="426" fill="#fff" font-size="14">A</text>
  <circle cx="400" cy="450" r="26" fill="rgba(96,165,250,0.25)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="392" y="456" fill="#fff" font-size="14">B</text>
  <circle cx="345" cy="480" r="20" fill="rgba(248,113,113,0.25)" stroke="#f87171" stroke-width="1.5"/>
  <text x="339" y="485" fill="#fff" font-size="12">Y</text>
  <circle cx="425" cy="400" r="14" fill="#ffcc00"/>
  <text x="419" y="405" fill="#000" font-size="14" font-weight="bold">3</text>

  <!-- Hold-2s indicator on joystick -->
  <circle cx="160" cy="450" r="80" fill="none" stroke="#ff5566" stroke-width="2" stroke-dasharray="4,5"/>
  <text x="90" y="545" fill="#ff5566" font-size="12">hold 2s → drag</text>
  <circle cx="60" cy="540" r="14" fill="#ffcc00"/>
  <text x="54" y="545" fill="#000" font-size="14" font-weight="bold">4</text>

  <!-- Whole-console drag illustration -->
  <path d="M450,420 Q560,380 650,420" fill="none" stroke="#ffcc00" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow2)"/>
  <rect x="650" y="380" width="380" height="180" rx="26" fill="none" stroke="rgba(255,204,0,0.4)" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="700" y="370" fill="#ffcc00" font-size="13">console dragged as one unit</text>

  <!-- Toggle button + settings, outside console -->
  <rect x="780" y="90" width="50" height="50" rx="12" fill="rgba(255,255,255,0.12)" stroke="#fff" stroke-width="1.5"/>
  <text x="792" y="122" fill="#fff" font-size="20">⏻</text>
  <circle cx="845" cy="95" r="14" fill="#ffcc00"/>
  <text x="839" y="100" fill="#000" font-size="14" font-weight="bold">5</text>

  <text x="70" y="120" fill="#fff" font-size="26">⚙</text>
  <circle cx="100" cy="100" r="14" fill="#ffcc00"/>
  <text x="94" y="105" fill="#000" font-size="14" font-weight="bold">6</text>

  <!-- Second rectangle example for dual-stick genres -->
  <rect x="620" y="400" width="0" height="0"/>
  <g opacity="0.5">
    <rect x="640" y="330" width="200" height="180" rx="26" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="655" y="325" fill="#aaa" font-size="12">optional 2nd rectangle</text>
    <text x="655" y="510" fill="#aaa" font-size="11">(twin-stick shooters only)</text>
  </g>

  <!-- Legend -->
  <rect x="880" y="70" width="290" height="480" rx="12" fill="#12141f" stroke="#333" stroke-width="1"/>
  <text x="900" y="100" fill="#ffcc00" font-size="17" font-weight="bold">Legend</text>

  <text x="900" y="132" fill="#fff" font-size="13" font-weight="bold">1  Console drag handle</text>
  <text x="900" y="149" fill="#aaa" font-size="11">Hold 2s anywhere on the rectangle's</text>
  <text x="900" y="163" fill="#aaa" font-size="11">edge/handle → drag entire console</text>

  <text x="900" y="192" fill="#fff" font-size="13" font-weight="bold">2  Glass joystick</text>
  <text x="900" y="209" fill="#aaa" font-size="11">backdrop-filter: blur(14px), thin</text>
  <text x="900" y="223" fill="#aaa" font-size="11">1px light border, translucent fill</text>

  <text x="900" y="252" fill="#fff" font-size="13" font-weight="bold">3  Grouped action buttons</text>
  <text x="900" y="269" fill="#aaa" font-size="11">Clustered tight, not spread across</text>
  <text x="900" y="283" fill="#aaa" font-size="11">screen — keeps footprint compact</text>

  <text x="900" y="312" fill="#fff" font-size="13" font-weight="bold">4  Per-control hold+drag</text>
  <text x="900" y="329" fill="#aaa" font-size="11">Hold a single control 2s to move</text>
  <text x="900" y="343" fill="#aaa" font-size="11">just that control within the rect</text>

  <text x="900" y="372" fill="#fff" font-size="13" font-weight="bold">5  Manual toggle button</text>
  <text x="900" y="389" fill="#aaa" font-size="11">Same function as 5-finger gesture</text>

  <text x="900" y="418" fill="#fff" font-size="13" font-weight="bold">6  Settings entry</text>
  <text x="900" y="435" fill="#aaa" font-size="11">Size / opacity / orientation profiles</text>

  <text x="900" y="470" fill="#666" font-size="10">Note: blur applied only to the small</text>
  <text x="900" y="484" fill="#666" font-size="10">joystick surface, not the full overlay —</text>
  <text x="900" y="498" fill="#666" font-size="10">keeps backdrop-filter cost low over a</text>
  <text x="900" y="512" fill="#666" font-size="10">live 60fps game canvas.</text>
</svg>
