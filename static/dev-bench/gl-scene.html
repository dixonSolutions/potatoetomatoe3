<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GL bench scene</title>
<script src="/game-storage-bridge.child.js"></script>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
	canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<script>
/*
 * Fixed WebGL2 workload for the perf bench (dev only).
 *
 * Every frame: one full-canvas fragment pass with a fixed-iteration loop (fill-rate /
 * shader cost), then DRAWS small instanced-free quads with a uniform change each (driver /
 * draw-call cost). `?load=light` should sit at vsync on any GPU; `?load=heavy` should not.
 * Any keydown flips the tint, so the frame after a key is visibly different.
 */
(function () {
	var params = new URLSearchParams(location.search);
	var heavy = params.get('load') !== 'light';
	var ITER = Number(params.get('iter')) || (heavy ? 2500 : 12);
	var DRAWS = Number(params.get('draws')) || (heavy ? 4000 : 150);

	var canvas = document.getElementById('c');
	var gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: false });
	if (!gl) { document.body.textContent = 'no webgl2'; return; }

	function sh(type, src) {
		var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
		if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
		return s;
	}
	function prog(vs, fs) {
		var p = gl.createProgram();
		gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
		gl.linkProgram(p); return p;
	}

	var bg = prog(
		'#version 300 es\nin vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}',
		'#version 300 es\nprecision highp float;in vec2 uv;out vec4 o;uniform float t;uniform vec3 tint;' +
		'void main(){vec2 z=uv*3.0-1.5;float a=0.0;for(int i=0;i<' + ITER + ';i++){' +
		'z=vec2(z.x*z.x-z.y*z.y,2.0*z.x*z.y)+vec2(sin(t*.3)*.7,cos(t*.2)*.7);a+=exp(-dot(z,z));}' +
		'o=vec4(tint*fract(a*.05+t*.1),1);}'
	);
	var quad = prog(
		'#version 300 es\nin vec2 p;uniform vec3 off;void main(){gl_Position=vec4(p*.02+off.xy,0,1);}',
		'#version 300 es\nprecision highp float;out vec4 o;uniform vec3 off;void main(){o=vec4(off.z,.5,1.-off.z,1);}'
	);

	var buf = gl.createBuffer();
	gl.bindBuffer(gl.ARRAY_BUFFER, buf);
	gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
	gl.enableVertexAttribArray(0);
	gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
	gl.bindAttribLocation(bg, 0, 'p'); gl.linkProgram(bg);
	gl.bindAttribLocation(quad, 0, 'p'); gl.linkProgram(quad);
	var uT = gl.getUniformLocation(bg, 't'), uTint = gl.getUniformLocation(bg, 'tint');
	var uOff = gl.getUniformLocation(quad, 'off');

	var tint = [1, 0.6, 0.2];
	window.addEventListener('keydown', function () { tint = [tint[2], tint[0], tint[1]]; });

	function resize() {
		var dpr = window.devicePixelRatio || 1;
		var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
		if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
	}

	function frame(ms) {
		resize();
		var t = ms / 1000;
		gl.viewport(0, 0, canvas.width, canvas.height);
		gl.useProgram(bg);
		gl.uniform1f(uT, t); gl.uniform3fv(uTint, tint);
		gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
		gl.useProgram(quad);
		for (var i = 0; i < DRAWS; i++) {
			var a = i * 2.399 + t;
			gl.uniform3f(uOff, Math.cos(a) * (i / DRAWS), Math.sin(a) * (i / DRAWS), (i % 7) / 7);
			gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
		}
		requestAnimationFrame(frame);
	}
	window.__benchScene = { heavy: heavy, iter: ITER, draws: DRAWS };
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
