<script>
/* AudioContext unlock */
(function(){
  function u(){
    if(window._au) return; window._au=true;
    try{var c=new(window.AudioContext||window.webkitAudioContext)();
      var b=c.createBuffer(1,1,22050);var s=c.createBufferSource();
      s.buffer=b;s.connect(c.destination);s.start(0);c.resume&&c.resume();
    }catch(e){}
    ['touchstart','pointerdown','click'].forEach(function(t){document.removeEventListener(t,u);});
  }
  ['touchstart','pointerdown','click'].forEach(function(t){document.addEventListener(t,u,{passive:true});});
})();
</script>

<script>
/* ================================================================
   CDN Ayarları — değiştir
   ================================================================ */
var BUILD_CDN = "https://cdn.jsdelivr.net/gh/school-management-google/hazmod@main/Build";          /* Build klasörünün CDN'i */
var SA_CDN    = "https://cdn.jsdelivr.net/gh/school-management-google/tortoino@main/StreamingAssets"; /* StreamingAssets CDN'i */

var DATA_FILE    = "b61481f1e3d76a798cc9d577ebc1a609";
var LOADER_FILE  = "8b2aa7ebb8ab0cdb36d650cc3e9b841a";
var FRAMEWORK    = "f6ef69d8e3279006f0bcf5fb433b92b0.framework.js.unityweb";
var WASM_FILE    = "382d3bcea5becf83736e7af046a15b02.wasm.unityweb";
var BUNDLE_FILE  = "aa/WebGL/realistic_assets_realistic_79c23d253bdcc1c64f425728f63340c4.bundle";

var DATA_PARTS   = 7;   /* 54.5MB / 8MB = 7 part */
var BUNDLE_PARTS = 7;   /* 50.8MB / 8MB = 7 part */

var config = {
  dataUrl:            null,   /* part'lardan set edilir */
  frameworkUrl:       BUILD_CDN + "/" + FRAMEWORK,
  codeUrl:            BUILD_CDN + "/" + WASM_FILE,
  streamingAssetsUrl: SA_CDN,
  companyName:        "Hazmob",
  productName:        "Hazmob FPS",
  productVersion:     "2.18.21"
};

var container        = document.querySelector("#unity-container");
var canvas           = document.querySelector("#unity-canvas");
var loadingCover     = document.querySelector("#loading-cover");
var progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
var progressBarFull  = document.querySelector("#unity-progress-bar-full");
var spinner          = document.querySelector('.spinner');
var dlStatus         = document.querySelector('#dl-status');

/* Progress renkler */
if(overlayBackgroundColor&&overlayBackgroundColor.trim()&&overlayBackgroundColor!=="-")
  canvas.style.background=overlayBackgroundColor;
if(progressBarFillColor&&progressBarFillColor.trim()&&progressBarFillColor!=="-")
  progressBarFull.style.background=progressBarFillColor;
if(progressBarBackgroundColor&&progressBarBackgroundColor.trim()&&progressBarBackgroundColor!=="-")
  progressBarEmpty.style.background=progressBarBackgroundColor;

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent))
  container.className = "unity-mobile";

loadingCover.style.display = "";

/* ── Progress bar yardımcısı ───────────────────────────────── */
/* DATA   :  0% →  40%
   BUNDLE : 40% →  80%
   Unity  : 80% → 100%  */
function setBar(pct, label) {
  progressBarFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || '';
}

var _bundleBlobUrl = null;

/* ── Part indirme ──────────────────────────────────────────── */
async function fetchParts(baseUrl, partCount, barStart, barEnd, labelPrefix) {
  var parts = [];
  for (var i = 0; i < partCount; i++) {
    var pct = barStart + (i / partCount) * (barEnd - barStart);
    setBar(pct, labelPrefix + (i+1) + '/' + partCount + ' (' + Math.round(pct) + '%)');
    var r = await fetch(baseUrl + '.part' + i);
    if (!r.ok) throw new Error(labelPrefix + 'part' + i + ' HTTP ' + r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    pct = barStart + ((i+1) / partCount) * (barEnd - barStart);
    setBar(pct, labelPrefix + (i+1) + '/' + partCount + ' (' + Math.round(pct) + '%)');
    console.log(labelPrefix + 'part' + i + ': ' + parts[parts.length-1].length + ' bytes');
  }
  var total = parts.reduce(function(s,p){return s+p.length;},0);
  var merged = new Uint8Array(total); var off = 0;
  for (var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  console.log(labelPrefix + 'merged: ' + total + ' bytes');
  return merged;
}

function makeBloburl("https://cdn.jsdelivr.net/gh/school-management-google/tortoino@main/uint8,%20filename") {
  var blob = new Blob([uint8], {type:'application/octet-stream'});
  return URL.createObjecturl("https://cdn.jsdelivr.net/gh/school-management-google/tortoino@main/blob") + '#' + encodeURIComponent(filename);
}

/* ── Bundle fetch intercept ────────────────────────────────── */
(function(){
  var _orig = window.fetch.bind(window);
  window.fetch = function(url, opts) {
    var s = typeof url==='string' ? url : (url&&url.url)||String(url);
    if (s.includes('realistic_assets_realistic_79c23d253bdcc1c64f425728f63340c4') && _bundleBlobUrl) {
      console.log('[Bundle] fetch intercepted');
      return _orig(_bundleBlobUrl, opts);
    }
    return _orig(url, opts);
  };
  var _xOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, async, u, p) {
    var s = typeof url==='string' ? url : String(url);
    if (s.includes('realistic_assets_realistic_79c23d253bdcc1c64f425728f63340c4') && _bundleBlobUrl)
      url = _bundleBlobUrl;
    return _xOpen.call(this, method, url, async!==false, u, p);
  };
})();

/* ── Loader ────────────────────────────────────────────────── */
var unityLoader = document.createElement("script");
unityLoader.src = BUILD_CDN + "/" + LOADER_FILE + ".loader.js";
unityLoader.onload = async function() {
  try {
    /* 1. DATA part'ları indir  (0% → 40%) */
    var dataBytes = await fetchParts(
      BUILD_CDN + "/" + DATA_FILE + ".data.unityweb",
      DATA_PARTS, 0, 40, 'Data indiriliyor... ');
    config.dataUrl = makeBlobUrl(dataBytes, DATA_FILE + ".data.unityweb");

    /* 2. BUNDLE part'ları indir (40% → 80%) */
    var bundleBytes = await fetchParts(
      SA_CDN + "/" + BUNDLE_FILE,
      BUNDLE_PARTS, 40, 80, 'Bundle indiriliyor... ');
    var bblob = new Blob([bundleBytes], {type:'application/octet-stream'});
    _bundleBlobUrl = URL.createObjecturl("https://cdn.jsdelivr.net/gh/school-management-google/tortoino@main/bblob");
    console.log('[Bundle] Ready');

  } catch(e) { alert("Download error: " + e.message); return; }

  /* 3. Unity başlat (80% → 100%) */
  setBar(80, 'loading...');
  createUnityInstance(canvas, config, function(progress) {
    setBar(80 + progress * 20,
      progress < 1 ? 'loading... ' + Math.round(80 + progress * 20) + '%' : '');
  }).then(function(inst) {
    gameInstance = inst;
    window.unityInstance = inst;
    loadingCover.style.display = "none";
  }).catch(function(msg) { alert(msg); });
};
document.body.appendChild(unityLoader);

document.addEventListener("pointerdown", function() {
  container.focus(); window.focus(); canvas.focus();
});
</script>
<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbyLqfuYNg4HqY0inO1-UyYb5pVvsb0FDxHj6mw418ypqPmoNzUgt0McBC9Q9JfLfFp39Q/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
