<!DOCTYPE html>
<html lang="en-us">
<head><base href="https://cdn.jsdelivr.net/gh/testamalame/x86x8x6@main/">
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/testamalame/x86x8x6@main/TemplateData/favicon.ico"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/testamalame/x86x8x6@main/TemplateData/style.css"/>
    <style>
        body, html { padding: 0; margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #unity-container { width: 100%; height: 100%; position: absolute; }
        #unity-canvas { width: 100%; height: 100%; background: #231f20; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #3498db; border-radius: 50%; width: 50px; height: 50px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #chunk-status { color: #fff; position: absolute; top: 70%; left: 50%; transform: translate(-50%, -50%); font-family: sans-serif; font-size: 14px; text-align: center; width: 100%; }
    </style>
</head>
<body class="dark">
<div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div id="loading-cover">
    <div id="unity-loading-bar">
        <div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/testamalame/x86x8x6@main/logo.png" onerror="this.style.display='none'"/></div>
        <div id="chunk-status">g+...</div>
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
        <div class="spinner"></div>
    </div>
</div>

<script>
    const buildUrl = "https://cdn.jsdelivr.net/gh/testamalame/x86x8x6@main/Build";
    const loaderUrl = buildUrl + "/ChoChoWeb.loader.js";
    
    // Parça Ayarları
    const dataPartCount = 4;
    const dataBaseName = buildUrl + "/ChoChoWeb.data.unityweb.part";

    const config = {
        dataUrl: "", // Blob ile dolacak
        frameworkUrl: buildUrl + "/ChoChoWeb.framework.js.unityweb",
        codeUrl: buildUrl + "/ChoChoWeb.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DarkPlay",
        productName: "Choo-Choo Charles Catch-up",
        productVersion: "1.0",
    };

    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const chunkStatus = document.querySelector("#chunk-status");

    let myGameInstance = null;
    let ysdk = null;

    // Blob Birleştirme Mantığı
    async function fetchAndCombineData() {
        const chunks = [];
        for (let i = 0; i < dataPartCount; i++) {
            chunkStatus.innerText = `g+...: ${i + 1}/${dataPartCount}`;
            const response = await fetch(`${dataBaseName}${i}`);
            if (!response.ok) throw new Error("Dosya parçası yüklenemedi: " + i);
            const buffer = await response.arrayBuffer();
            chunks.push(buffer);
        }
        chunkStatus.innerText = "Dosyalar birleştiriliyor...";
        const combinedBlob = new Blob(chunks, { type: "application/octet-stream" });
        return URL.createObjecturl("https://cdn.jsdelivr.net/gh/testamalame/x86x8x6@main/combinedBlob");
    }

    // Başlatıcı
    async function initApp() {
        try {
            const blobUrl = await fetchAndCombineData();
            config.dataUrl = blobUrl;
            chunkStatus.style.display = "none";
            loadUnity();
        } catch (e) {
            chunkStatus.innerText = "Yükleme hatası! Lütfen sayfayı yenileyin.";
            console.error(e);
        }
    }

    function loadUnity() {
        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = `${100 * progress}%`;
            }).then((unityInstance) => {
                myGameInstance = unityInstance;
                loadingCover.style.display = "none";
                forceFocus();
                
                setTimeout(() => {
                    LanguageRequest();
                    RequestingEnvironmentData();
                    forceFocus();
                }, 500);
            }).catch((message) => { console.error(message); });
        };
        document.body.appendChild(script);
    }

    function forceFocus() {
        window.focus();
        if (canvas) canvas.focus();
    }

    window.addEventListener('pointerdown', forceFocus);
    window.addEventListener('touchstart', forceFocus);

    // Yandex SDK Initialization
    if (typeof YaGames !== "undefined") {
        YaGames.init().then(_ysdk => {
            ysdk = _ysdk;
            if (myGameInstance) {
                LanguageRequest();
            }
        }).catch(e => {
            console.warn("SDK Bypass active.");
        });
    }

    function LanguageRequest() {
        let lang = "en";
        let browserLang = navigator.language.split('-')[0];
        if (ysdk && ysdk.environment && ysdk.environment.i18n.lang !== 'ru') {
            lang = ysdk.environment.i18n.lang;
        } else {
            lang = (browserLang === 'tr' || browserLang === 'en') ? browserLang : 'en';
        }
        if (myGameInstance) {
            myGameInstance.SendMessage('YandexGame', 'SetLanguage', lang);
        }
    }

    function RequestingEnvironmentData() {
        let currentLang = "en";
        let browserLang = navigator.language.split('-')[0];
        if (ysdk && ysdk.environment && ysdk.environment.i18n.lang !== 'ru') {
            currentLang = ysdk.environment.i18n.lang;
        } else {
            currentLang = (browserLang === 'tr') ? 'tr' : 'en';
        }

        const data = {
            "language": currentLang,
            "domain": "com",
            "deviceType": (ysdk && ysdk.deviceInfo) ? ysdk.deviceInfo.type : "desktop",
            "isMobile": /iPhone|iPad|iPod|Android/i.test(navigator.userAgent),
            "isDesktop": !/iPhone|iPad|iPod|Android/i.test(navigator.userAgent),
            "isTablet": false,
            "isTV": false,
            "appID": "internal",
            "browserLang": browserLang,
            "payload": null,
            "promptCanShow": false,
            "reviewCanShow": false
        };

        if (myGameInstance) {
            myGameInstance.SendMessage('YandexGame', 'SetEnvironmentData', JSON.stringify(data));
        }
    }

    function FullAdShow() {
        if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'OpenFullAd');
        setTimeout(() => {
            if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'CloseFullAd', 'true');
            forceFocus();
        }, 50);
    }

    function RewardedShow(id) {
        if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'OpenVideo');
        setTimeout(() => {
            if (myGameInstance) {
                myGameInstance.SendMessage('YandexGame', 'RewardVideo', id);
                myGameInstance.SendMessage('YandexGame', 'CloseVideo');
            }
            forceFocus();
        }, 50);
    }

    function InitSDK(photoSize, scopes) { if (ysdk && ysdk.features && ysdk.features.LoadingAPI) ysdk.features.LoadingAPI.ready(); forceFocus(); }
    function InitPayments() {}
    function BuyPayments(id) { forceFocus(); }
    function GetPayments() { if(myGameInstance) myGameInstance.SendMessage('YandexGame', 'PaymentsEntries', JSON.stringify({id:[],purchased:[]})); }
    function StickyAdActivity(show) {}
    function Review() { forceFocus(); }
    function PromptShow() { forceFocus(); }
    function SaveCloud(jsonData, flush) {}
    function LoadCloud() { if (myGameInstance) myGameInstance.SendMessage('YandexGame', 'SetLoadSaves', "noData"); }
    function StaticRBTDeactivate() { forceFocus(); }

    initApp(); // Uygulamayı başlat
</script>

<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbxLG5DHBe-sIbduDvwQZYJ3oaX_ha7rsvroprCFkQsnpZK_PEdipNia5ghxI_sdXYpv/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>

</body>
</html>
