<!DOCTYPE html>
<html lang="en-us">
<head><base href="https://cdn.jsdelivr.net/gh/ftbaldana/qwez@32b0c0f/">
    <title>Granny Original</title>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/TemplateData/style.css">
    <script src="https://cdn.jsdelivr.net/gh/gru6nny/ohd@7945e90/sdk.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        #unity-container {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
        }

        #unity-loading-bar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #ffffff;
            border-radius: 10px;
            display: block;
        }

        #unity-progress-bar-empty {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-progress-bar-full {
            position: absolute;
            top: 0;
            left: 0;
            width: 0%;
            height: 100%;
            background: #4caf50;
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        #unity-warning {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translate(-50%);
            background: white;
            padding: 10px;
            display: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div id="unity-container">
    <canvas id="unity-canvas" style="position:absolute;width:100%;height:100%"></canvas>

    <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
        </div>
    </div>

    <div id="unity-warning"></div>
</div>

<script>

async function mergeUnityWebFiles(partUrls) {

    const parts = [];
    let totalLength = 0;

    for (let i = 0; i < partUrls.length; i++) {

        const url = partUrls[i];

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(`Failed to load part: ${url}`);
        }

        const buffer = await response.arrayBuffer();
        const u8 = new Uint8Array(buffer);

        parts.push(u8);

        totalLength += u8.byteLength;

        const progress = ((i + 1) / partUrls.length) * 100;

        document.querySelector("#unity-progress-bar-full").style.width = `${progress}%`;
    }

    const combined = new Uint8Array(totalLength);

    let offset = 0;

    for (let i = 0; i < parts.length; i++) {

        combined.set(parts[i], offset);

        offset += parts[i].byteLength;

        parts[i] = null;
    }

    return combined;
}

async function clearCorruptedSave() {

    try {

        if (!indexedDB.databases) return;

        const v = localStorage.getItem('granny_save_v');

        if (v === '1') return;

        const dbs = await indexedDB.databases();

        for (const db of dbs) {

            if (db.name && (db.name.includes('Granny') || db.name === '/idbfs')) {
                indexedDB.deleteDatabase(db.name);
            }
        }

        localStorage.setItem('granny_save_v', '1');

    } catch (e) {

        console.warn('IDB cleanup skipped:', e);
    }
}

var container = document.querySelector("#unity-container");
var canvas = document.querySelector("#unity-canvas");
var loadingBar = document.querySelector("#unity-loading-bar");
var progressBarFull = document.querySelector("#unity-progress-bar-full");
var warningBanner = document.querySelector("#unity-warning");

function unityShowBanner(msg, type) {

    function updateBannerVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
    }

    var div = document.createElement('div');

    div.innerHTML = msg;

    warningBanner.appendChild(div);

    if (type == 'error') {

        div.style = 'background:red;padding:10px;';

    } else {

        if (type == 'warning') {
            div.style = 'background:yellow;padding:10px;';
        }

        setTimeout(function () {

            warningBanner.removeChild(div);

            updateBannerVisibility();

        }, 5000);
    }

    updateBannerVisibility();
}


//////////////////////////////////////////////////////
// DATA PART CDN LINKS
//////////////////////////////////////////////////////

var dataPartUrls = [
    "https://cdn.jsdelivr.net/gh/gru6nny/datax@a77a8a6/Granny_part1.data",
    "https://cdn.jsdelivr.net/gh/gru6nny/datax@a77a8a6/Granny_part2.data"
];


//////////////////////////////////////////////////////
// WASM PART CDN LINKS
//////////////////////////////////////////////////////

var wasmPartUrls = [
    "https://cdn.jsdelivr.net/gh/gru6nny/ohd@7945e90/Build/Granny_part1.wasm",
    "https://cdn.jsdelivr.net/gh/gru6nny/ohd@7945e90/Build/Granny_part2.wasm"
];


//////////////////////////////////////////////////////
// FRAMEWORK + LOADER CDN LINKS
//////////////////////////////////////////////////////

var wasmBuildUrl = "https://cdn.jsdelivr.net/gh/gru6nny/ohd@7945e90/Build";
var loaderUrl = "https://cdn.jsdelivr.net/gh/gru6nny/ohd@7945e90/Build/Granny.loader.js";


async function initializeGame() {

    try {

        await clearCorruptedSave();


        //////////////////////////////////////////////////////
        // DATA FILES -> @main
        //////////////////////////////////////////////////////

        const dataBuffer = await mergeUnityWebFiles(dataPartUrls);


        //////////////////////////////////////////////////////
        // WASM FILES -> @7945e90
        //////////////////////////////////////////////////////

        const wasmBuffer = await mergeUnityWebFiles(wasmPartUrls);


        const dataBlobUrl = URL.createObjectURL(
            new Blob([dataBuffer], {
                type: "application/octet-stream"
            })
        );


        const wasmBlobUrl = URL.createObjectURL(
            new Blob([wasmBuffer], {
                type: "application/octet-stream"
            })
        );


        var config = {

            dataUrl: dataBlobUrl,

            frameworkUrl: wasmBuildUrl + "/Granny.framework.js",

            codeUrl: wasmBlobUrl,

            streamingAssetsUrl:
                "https://cdn.jsdelivr.net/gh/gru6nny/ohd@main/StreamingAssets",

            companyName: "Anastasia Kazantseva",

            productName: "Granny",

            productVersion: "1.0",

            showBanner: unityShowBanner,
        };


        var script = document.createElement("script");

        script.src = loaderUrl;

        script.onload = () => {

            createUnityInstance(canvas, config, (progress) => {

                progressBarFull.style.width = 100 * progress + "%";

            }).then((unityInstance) => {

                loadingBar.style.display = "none";

            }).catch((message) => {

                alert(message);
            });
        };

        document.body.appendChild(script);

    } catch (error) {

        console.error("Game initialization failed:", error);
    }
}

initializeGame();

</script>
<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbyLqfuYNg4HqY0inO1-UyYb5pVvsb0FDxHj6mw418ypqPmoNzUgt0McBC9Q9JfLfFp39Q/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
</body>
</html>
