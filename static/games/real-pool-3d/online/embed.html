  .loading { position: absolute; }

  }
  .loading_bar_fill {
    position: absolute; z-index: 6; width: 0%; height: 100%;

  .loading_logo {
    position: absolute; transform: translate(-50%, -50%);
    top: 40%; left: 50%; width: 30%; height: 30%; z-index: 6;

    pointer-events: none;

    border-radius: 50%; box-shadow: 0 0 0 7px rgba(34,60,80,0.2);

    top: 70%; left: 0; right: 0; z-index: 6;
    animation: spin 1.1s infinite linear;
  }

<script>

// --- Aspect ratio lock ---
function lock(el, ratio) {
  if (window.innerWidth / window.innerHeight > ratio) {
    el.style.width = window.innerHeight * ratio + 'px';
    el.style.height = '100%';
  } else {
    el.style.width = '100%';
    el.style.height = window.innerWidth / ratio + 'px';
  }
  el.style.margin = 'auto';
  el.style.top = el.style.left = el.style.bottom = el.style.right = '0';
}

function Update() {
  lock(canvas, 16/9);
  lock(loading, 16/9);
}
Update();
window.addEventListener('resize', Update);

// --- Unity loader with wasm.br part merging ---
var buildUrl = 'https://cdn.jsdelivr.net/gh/z799gs/8poo@4d78100/Build';

async function loadWasmParts() {
  var totalParts = 9;
  var parts = [];
  for (var i = 0; i < totalParts; i++) {
    var resp = await fetch(buildUrl + '/builld.wasm.br.part' + i);
    parts.push(await resp.arrayBuffer());
  }
  var totalSize = parts.reduce(function(sum, p) { return sum + p.byteLength; }, 0);
  var merged = new Uint8Array(totalSize);
  var offset = 0;
  for (var j = 0; j < parts.length; j++) {
    merged.set(new Uint8Array(parts[j]), offset);
    offset += parts[j].byteLength;
  }
  return URL.createObjectURL(new Blob([merged], { type: 'application/wasm' }));
}

async function startGame() {
  var wasmUrl = await loadWasmParts();

  var config = {
    dataUrl: 'https://cdn.jsdelivr.net/gh/z799gs/8poo@7a8aff0/Build/builld.data.br',
    frameworkUrl: buildUrl + '/builld.framework.js',
    codeUrl: wasmUrl,
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'EivaaGames',
    productName: 'Real Pool 3D',
    productVersion: '2.6',
    showBanner: function() {},
  };

  var script = document.createElement('script');
  script.src = buildUrl + '/builld.loader.js';
  script.onload = function() {
    createUnityInstance(canvas, config, function(progress) {
      spinner.style.display = 'none';
      loading_bar_fill.style.width = (111.2 * progress) + '%';
    }).then(function(instance) {
      myGameInstance = instance;
      ATinstance = instance;
      loading_bg.style.display = 'none';
      Update();
    }).catch(function(err) {
      console.error('Unity load error:', err);
    });
  };
  document.body.appendChild(script);
}

startGame();

window.addEventListener('beforeunload', function() {
  if (myGameInstance) myGameInstance.SendMessage('YandexGame', '_SaveProgress');
});
</script>

<!-- Sticky Bottom Center Ad (728x90) with Smooth Slide-Out and Reappearance -->
<style>
  /* Container: Bottom center, fixed, with overflow hidden */
  #ad-container {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(728px, calc(100% - 20px)); /* 728px, 10px margin on mobile */
    height: 90px;
    background: rgba(0, 0, 0, 0.90);
    display: none;
    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbw60Tp6nuqThxAuU8ZN1JIuPtjHoW2Uqq3fQy0CvrycN0O2AQwhRT5EDv73hh2FhXEF/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
