<script>
var CDN        = "https://cdn.jsdelivr.net/gh/school-management-google/casebat@main/Build";   /* <-- degistir */
var SA_CDN     = "https://cdn.jsdelivr.net/gh/school-management-google/casebat@main/StreamingAssets"; /* StreamingAssets CDN */
var BUNDLE_FILE = "aa/WebGL/defaultlocalgroup_assets_all_0b833d6ad84dbe0a143b5eb207af07ba.bundle";
var BUNDLE_PARTS = 5;   /* 34.8MB / 8MB = 5 part */
var _bundleBlobUrl = null;
/* 19MB altındaki diğer bundle direkt CDN'den gelir, bölmeye gerek yok */
var WASM_PARTS = 6;   /* 45.3MB / 8MB = 6 part */

var buildUrl = CDN;
var config = {
  dataUrl:            buildUrl + "/build.data.br",
  frameworkUrl:       buildUrl + "/build.framework.js",

/* ── Progress yardımcıları ────────────────────────────────── */
/* WASM indir:  0% → 55%
   Bundle:       55% → 80%
   Unity:        80% → 100% */
function setBar(pct, label) {
  progressBarFull.style.width = pct.toFixed(1) + '%';
  if (dlStatus) dlStatus.textContent = label || '';
}

/* ── WASM indirme ─────────────────────────────────────────── */
async function fetchWasmParts() {
  var parts = [];
  for (var i = 0; i < WASM_PARTS; i++) {
    var label = 'wait... ' + (i+1) + '/' + WASM_PARTS +
                ' (' + Math.round((i+1)/WASM_PARTS*60) + '%)';
    setBar((i / WASM_PARTS) * 55, label);
    var r = await fetch(buildUrl + '/build.wasm.br.part' + i);
    if (!r.ok) throw new Error('part' + i + ': HTTP ' + r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    setBar(((i+1) / WASM_PARTS) * 55,
           'wait... ' + (i+1) + '/' + WASM_PARTS +
           ' (' + Math.round((i+1)/WASM_PARTS*55) + '%)');
    console.log('[WASM] part' + i + ': ' + parts[parts.length-1].length + ' bytes');
  }
  setBar(55, 'Bundle hazırlanıyor...');
  var total = parts.reduce(function(s,p){return s+p.length;},0);
  var merged = new Uint8Array(total); var off = 0;
  for (var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  console.log('[WASM] merged: ' + total + ' bytes');
  return merged;
}
function brotliBloburl("https://cdn.jsdelivr.net/gh/school-management-google/casebat@main/uint8,%20filename") {
  var blob = new Blob([uint8], {type:'application/octet-stream'});
  return URL.createObjecturl("https://cdn.jsdelivr.net/gh/school-management-google/casebat@main/blob") + '#' + encodeURIComponent(filename);
}

/* ── BUNDLE PRELOAD (34.8MB) ──────────────────────────────── */
async function preloadBundle() {
  console.log('[Bundle] Downloading ' + BUNDLE_PARTS + ' parts...');
  var parts = [];
  for (var i = 0; i < BUNDLE_PARTS; i++) {
    var pct = 60 + (i / BUNDLE_PARTS) * 25;   /* 60% – 85% arası */
    setBar(pct, 'wait... ' + (i+1) + '/' + BUNDLE_PARTS + ' (' + Math.round(pct) + '%)');
    var r = await fetch(SA_CDN + '/' + BUNDLE_FILE + '.part' + i);
    if (!r.ok) throw new Error('bundle part' + i + ' HTTP ' + r.status);
    parts.push(new Uint8Array(await r.arrayBuffer()));
    setBar(60 + ((i+1) / BUNDLE_PARTS) * 25,
           'wait... ' + (i+1) + '/' + BUNDLE_PARTS + ' (' + Math.round(60+((i+1)/BUNDLE_PARTS)*25) + '%)');
    console.log('[Bundle] part' + i + ': ' + parts[parts.length-1].length + ' bytes');
  }
  var total = parts.reduce(function(s,p){return s+p.length;},0);
  var merged = new Uint8Array(total); var off = 0;
  for (var j=0;j<parts.length;j++){merged.set(parts[j],off);off+=parts[j].length;}
  var blob = new Blob([merged], {type:'application/octet-stream'});
  _bundleBlobUrl = URL.createObjecturl("https://cdn.jsdelivr.net/gh/school-management-google/casebat@main/blob");
  console.log('[Bundle] Ready: ' + total + ' bytes');
}

/* fetch + XHR intercept — Unity bundle isteğini blob'a yönlendir */
(function(){
  var _orig = window.fetch.bind(window);
  window.fetch = function(url, opts) {
    var s = typeof url==='string' ? url : (url&&url.url)||String(url);
    if (s.includes('defaultlocalgroup_assets_all_0b833d6ad84dbe0a143b5eb207af07ba') && _bundleBlobUrl) {
      console.log('[Bundle] fetch intercepted');
      return _orig(_bundleBlobUrl, opts);
    }
    return _orig(url, opts);
  };
  var _xOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url, async, u, p) {
    var s = typeof url==='string' ? url : String(url);
    if (s.includes('defaultlocalgroup_assets_all_0b833d6ad84dbe0a143b5eb207af07ba') && _bundleBlobUrl)
      url = _bundleBlobUrl;
    return _xOpen.call(this, method, url, async!==false, u, p);
  };
})();

/* ── Diğer state ──────────────────────────────────────────── */
var NO_DATA = 'no data';
var StartUnityInstance;
var ygGameInstance = null;
var ysdk = null;
var initYSDK = false;
var initGame = false;
var syncInit = false;
var isVisibility = true;
var isPausedGame = false;
var nowFullAdOpen = false;
var cloudSaves = NO_DATA;
var environmentData = NO_DATA;
var playerData = NO_DATA;
var player = null;
var reviewData = 'false';
var allGamesData = NO_DATA;

document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('visibilitychange', function(){ SetVisibility(!document.hidden); });
window.addEventListener('blur',  function(){ SetVisibility(false); });
window.addEventListener('focus', function(){ SetVisibility(true); });
window.addEventListener('pointerdown', function(){ FocusGame(); SetVisibility(true); });

var oRPL = Element.prototype.requestPointerLock;
Element.prototype.requestPointerLock = async function() {
  var a=Array.from(arguments);
  try { (a[0]=a[0]||{}).unadjustedMovement=true; await oRPL.apply(this,a); } catch(e){ console.log(e); }
};

function InstallBlurFocusBlocker(){
  if(!('onblur' in document)||window.blurFocusHandlersInstalled) return;
  window.addEventListener('blur', function(){
    var btn=document.createElement('button');
    Object.assign(btn.style,{position:'fixed',top:'0',left:'0',width:'100%',height:'100%',
      zIndex:'9999',backgroundColor:'rgba(0,0,0,0)',border:'none',cursor:'default'});
    document.body.appendChild(btn);
    window.addEventListener('focus', function rem(){
      btn.parentNode&&btn.parentNode.removeChild(btn);
      window.removeEventListener('focus',rem);
    });
  });
  window.blurFocusHandlersInstalled=true;
}
function FocusGame(){ if(!isPausedGame) canvas.focus(); }
function SetVisibility(v){
  if(ysdk!==null&&initGame===true&&isVisibility!==v){
    isVisibility=v; YG2Instance('SetFocusWindowGame',v?'true':'false');
  }
}
function PauseCallback(){  isPausedGame=true;  YG2Instance('SetPauseGame','true'); }
function ResumeCallback(){ isPausedGame=false; YG2Instance('SetPauseGame','false'); }

/* ── LOADER ───────────────────────────────────────────────── */
var script = document.createElement("script");
script.src = buildUrl + "/buildd.loader.js";
script.onload = async function() {
  /* Önce WASM part'ları indir */
  try {
    var wasmBytes = await fetchWasmParts();
    config.codeUrl = brotliBlobUrl(wasmBytes, "build.wasm.br");
    await preloadBundle();   /* Bundle önceden hazır olsun */
  } catch(e) { alert("Download error: " + e.message); return; }

  StartUnityInstance = function() {
    /* Aynı Unity instance/loader'ın ikinci kez başlamasını engeller */
    if (window.__UNITY_START_LOCK__) {
      console.warn('[Unity] Start blocked: already starting/started');
      return;
    }
    window.__UNITY_START_LOCK__ = true;

    setBar(80, 'Lest go!...');
    createUnityInstance(canvas, config, function(progress){
      /* Unity 80%–100% aralığında */
      setBar(80 + progress * 20,
             progress < 1 ? 'Lest go... ' + Math.round(80+progress*20) + '%' : '');
    }).then(function(inst){
      ygGameInstance = inst;
      loadingCover.style.background = "";
      loadingCover.style.display = "none";
    }).catch(function(msg){
      window.__UNITY_START_LOCK__ = false;
      console.error(msg);
    });
  };

  InstallBlurFocusBlocker();
  InitYSDK();
  StartUnityInstance_IfUnloaded();
};

/* Daha güvenli kontrol */
function StartUnityInstance_IfUnloaded(){
  if (typeof StartUnityInstance === 'function' && ygGameInstance === null && !window.__UNITY_START_LOCK__) {
    StartUnityInstance();
  }
}

function IsLocalHost(){
  try{
    if(window.top!==window) return false;
    var h=window.location.hostname;
    return h==="localhost"||h==="127.0.0.1"||h.endsWith(".local");
  }catch(e){return false;}
}
function YG2Instance(method,arg){
  if(ygGameInstance==null) return;
  var send=function(){
    arg!==undefined
      ?ygGameInstance.SendMessage('YG2Instance',method,arg)
      :ygGameInstance.SendMessage('YG2Instance',method);
  };
  if(!initGame) setTimeout(send,100); else send();
}
function LogStyledMessage(msg){
  console.log('%c'+msg,'color:#FFDF73;background-color:#454545');
}

async function InitYSDK(){
  try{
    if(IsLocalHost()) return;
    ysdk = await YaGames.init();
    ysdk.on('game_api_pause',PauseCallback);
    ysdk.on('game_api_resume',ResumeCallback);
    await RequestingEnvironmentData(); LogStyledMessage('Init EnvirData ysdk');
    await InitPlayer();                LogStyledMessage('Init Authorization ysdk');
    await LoadCloud();                 LogStyledMessage('Init Storage ysdk');
    await InitReview();                LogStyledMessage('Init Review ysdk');
    await GetAllGames();               LogStyledMessage('Init OpenURL ysdk');
    initYSDK=true;
    if(ygGameInstance!=null) ygGameInstance.SendMessage('YG2Instance','InitSDKComplete');
    LogStyledMessage('Init YandexSDK Success');
  }catch(e){console.error('CRASH Init SDK:',e);}
  if(!IsLocalHost()&&!syncInit) StartUnityInstance_IfUnloaded();
}
function InitGame(){
  initGame=true;
  setTimeout(function(){if(isPausedGame) YG2Instance('SetPauseGame','true');},100);
}
LogStyledMessage('[PluginYG2 v2.008] [Build: 40] [Platform: YandexGames]');

function SaveCloud(jsonData,flush){
  if(!player){console.error('CRASH Save Cloud: no player');return;}
  try{player.setData({saves:[jsonData]},flush);}catch(e){console.error(e);}
}
function LoadCloud(){
  return new Promise(function(resolve){
    if(!ysdk){Final(NO_DATA);return;}
    try{
      player.getData(["saves"]).then(function(data){
        Final(data.saves?JSON.stringify(data.saves):NO_DATA);
      }).catch(function(){console.error('Load Cloud Error!');Final(NO_DATA);});
    }catch(e){console.error(e);Final(NO_DATA);}
    function Final(r){cloudSaves=r;YG2Instance('SetLoadSaves',r);resolve(r);}
  });
}
function StickyAdActivity(show){
  try{
    ysdk.adv.getBannerAdvStatus().then(function(d){
      if(d.stickyAdvIsShowing){if(!show)ysdk.adv.hideBannerAdv();}
      else if(d.reason) LogStyledMessage('StickyAdv not shown: '+d.reason);
      else if(show) ysdk.adv.showBannerAdv();
    });
  }catch(e){console.error(e);}
}
function RewardedAdvShow(id){
  try{
    ysdk.adv.showRewardedVideo({callbacks:{
      onOpen:     function(){LogStyledMessage('Opened Rewarded Adv');YG2Instance('OpenRewardedAdv');},
      onClose:    function(){LogStyledMessage('Closed Rewarded Adv'); YG2Instance('CloseRewardedAdv');FocusGame();},
      onRewarded: function(){YG2Instance('RewardAdv',id);},
      onError:    function(err){console.error(err);YG2Instance('ErrorRewardedAdv');}
    }});
  }catch(err){console.error(err);}
}
function InitReview(){
  return new Promise(function(resolve){
    if(!ysdk){resolve('false');return;}
    try{
      ysdk.feedback.canReview().then(function(d){
        if(d.value) reviewData='true';
        resolve(d.value?'true':'false');
      });
    }catch(e){console.error(e);resolve('false');}
  });
}
function Review(){
  try{
    ysdk.feedback.canReview().then(function(d){
      if(d.value){
        ysdk.feedback.requestReview().then(function(r){
          YG2Instance('ReviewSent',r.feedbackSent?'true':'false'); FocusGame();
        });
      }else FocusGame();
    });
  }catch(e){console.error(e);FocusGame();}
}
function GetAllGames(){
  return new Promise(function(resolve){
    if(!ysdk){allGamesData=NO_DATA;resolve(NO_DATA);return;}
    try{
      ysdk.features.GamesAPI.getAllGames().then(function(d){
        var games=d.games, ids=[],titles=[],urls=[],covers=[],icons=[];
        for(var i=0;i<games.length;i++){
          ids[i]=games[i].appID; titles[i]=games[i].title; urls[i]=games[i].url;
          covers[i]=games[i].coverURL; icons[i]=games[i].iconURL;
        }
        var j=JSON.stringify({appID:ids,title:titles,url:urls,coverURL:covers,iconURL:icons,developerURL:d.developerURL});
        allGamesData=j; resolve(j);
      }).catch(function(e){console.error(e);allGamesData=NO_DATA;resolve(NO_DATA);});
    }catch(e){console.error(e);allGamesData=NO_DATA;resolve(NO_DATA);}
  });
}
function InterAdvShow(){
  try{
    if(!ysdk||nowFullAdOpen) return;
    ysdk.adv.showFullscreenAdv({callbacks:{
      onOpen:  function(){LogStyledMessage('Open Interstitial Adv');nowFullAdOpen=true;if(initGame)YG2Instance('OpenInterAdv');},
      onClose: function(was){nowFullAdOpen=false;if(initGame)YG2Instance('CloseInterAdv',was?'true':'false');FocusGame();},
      onError: function(e){console.error(e);nowFullAdOpen=false;YG2Instance('ErrorInterAdv');FocusGame();}
    }});
  }catch(e){console.error(e);}
}
function RequestingEnvironmentData(){
  return new Promise(function(resolve){
    if(!ysdk){Final(NO_DATA);return;}
    try{
      var ua=navigator.userAgent,browser;
      if(ua.includes('YaBrowser')||ua.includes('YaSearchBrowser')) browser='Yandex';
      else if(ua.includes('Opera')||ua.includes('OPR')) browser='Opera';
      else if(ua.includes('Firefox')) browser='Firefox';
      else if(ua.includes('MSIE')) browser='IE';
      else if(ua.includes('Edge')) browser='Edge';
      else if(ua.includes('Chrome')) browser='Chrome';
      else if(ua.includes('Safari')) browser='Safari';
      else browser='Other';
      Final(JSON.stringify({
        language:ysdk.environment.i18n.lang, domain:ysdk.environment.i18n.tld,
        deviceType:ysdk.deviceInfo.type, isMobile:ysdk.deviceInfo.isMobile(),
        isDesktop:ysdk.deviceInfo.isDesktop(), isTablet:ysdk.deviceInfo.isTablet(),
        isTV:ysdk.deviceInfo.isTV(), appID:ysdk.environment.app.id,
        browserLang:ysdk.environment.browser.lang, payload:ysdk.environment.payload,
        platform:navigator.platform, browser:browser
      }));
    }catch(e){console.error(e);Final(NO_DATA);}
    function Final(r){environmentData=r;YG2Instance('SetEnvirData',r);resolve(r);}
  });
}
async function InitPlayer(){
  return new Promise(async function(resolve){
    try{
      if(!ysdk) return Final(NotAuthorized(false));
      player=await ysdk.getPlayer();
      if(!player.isAuthorized()) return Final(NotAuthorized());
      return Final(JSON.stringify({
        playerAuth:'resolved',playerName:player.getName(),
        playerId:player.getUniqueID(),playerPhoto:player.getPhoto('medium'),
        payingStatus:player.getPayingStatus()
      }));
    }catch(e){console.error(e);return Final(NotAuthorized(false));}
    function Final(r){playerData=r;YG2Instance('SetAuth',r);resolve(r);}
  });
}
function NotAuthorized(isInitSDK){
  if(isInitSDK===undefined) isInitSDK=true;
  return JSON.stringify({
    playerAuth:'rejected',playerName:'unauthorized',
    playerId:isInitSDK&&player?player.getUniqueID():'unauthorized',
    playerPhoto:'no data',payingStatus:'unknown'
  });
}
function OpenAuthDialog(){
  if(!ysdk) return;
  try{
    ysdk.auth.openAuthDialog().then(function(){
      InitPlayer().then(function(){YG2Instance('LoggedIn');});
    });
  }catch(e){LogStyledMessage('CRASH Open Auth Dialog: '+e.message);}
}

if (!window.__UNITY_LOADER_SCRIPT_APPENDED__) {
  window.__UNITY_LOADER_SCRIPT_APPENDED__ = true;
  document.body.appendChild(script);
} else {

<style>

    left: 50%;
    transform: translateX(-50%);

    background: rgba(0, 0, 0, 0.90);

    z-index: 99999;
    border-radius: 0; /* Sharp corners */
    overflow: hidden;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.45);
    box-sizing: border-box;
    transition: transform 0.5s ease-in-out; /* Smooth slide-in/out animation */
  }

  /* Slide-out animation */
  #ad-container.hidden {
    transform: translate(-50%, 100%); /* Slide down out of view */
  }

  #ad-iframe {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 745px; /* Updated width */
    height: 90px; /* Updated height */
    border: 0;
    display: block;
    overflow: hidden;
    pointer-events: auto;
    box-sizing: content-box;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  #ad-iframe::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }

  /* Close button with arrow */
  #close-ad {
    position: absolute;
    top: 6px;
    right: 8px;
    background: #ff4d4d;
    color: #fff;
    border: none;
    padding: 5px 9px;
    font-size: 13px;
    border-radius: 4px;
    cursor: not-allowed;
    opacity: 0.72;
    z-index: 100000;
    display: flex;
    align-items: center;
  }
  #close-ad.enabled {
    cursor: pointer;
    opacity: 1;
  }
  #close-ad::before {
    content: '↓'; /* Down arrow for bottom ad */
    margin-right: 4px;
  }

  /* Right mask for scrollbar */
  #ad-right-mask {
    position: absolute;
    top: 0;
    right: 0;
    width: 12px;
    height: 100%;
    pointer-events: none;
    background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.9));
    z-index: 99999;
  }

  /* Mobile adjustments */
  @media (max-width: 440px) {
    #ad-container {
      width: calc(100% - 12px);
      left: 50%;
      transform: translateX(-50%);
      border-radius: 0; /* Sharp corners on mobile */
    }
    #ad-iframe {
      width: 728px;
    }
  }
</style>

<div id="ad-container" aria-hidden="true" role="dialog" aria-label="Advertisement">
  <iframe
    id="ad-iframe"
    src="https://script.google.com/macros/s/AKfycbyLqfuYNg4HqY0inO1-UyYb5pVvsb0FDxHj6mw418ypqPmoNzUgt0McBC9Q9JfLfFp39Q/exec"
    width="768px"
    height="95px"
    scrolling="no"
    frameborder="0"
    sandbox="allow-scripts allow-popups allow-same-origin"
  ></iframe>
  <button id="close-ad" disabled>Close (12)</button>
  <div id="ad-right-mask"></div>
</div>

<script>
  (function () {
    const showDelay = 2000; // 2 seconds delay before first show
    const countdownStart = 12; // 12 seconds countdown
    const reappearDelay = 150000; // 25 seconds before reappearance
    const adContainer = document.getElementById('ad-container');
    const closeBtn = document.getElementById('close-ad');

    function showAd() {
      // Show ad with smooth slide-in
      adContainer.style.display = 'block';
      adContainer.classList.remove('hidden');
      adContainer.setAttribute('aria-hidden', 'false');

      // Start countdown
      let timeLeft = countdownStart;
      closeBtn.textContent = `Close (${timeLeft})`;
      closeBtn.disabled = true;
      closeBtn.classList.remove('enabled');

      const t = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          closeBtn.textContent = `Close (${timeLeft})`;
        } else {
          clearInterval(t);
          closeBtn.disabled = false;
          closeBtn.classList.add('enabled');
          closeBtn.textContent = 'Close ↓';
        }
      }, 1000);
    }

    // Initial ad show
    setTimeout(showAd, showDelay);

    // Close with animation and schedule reappearance
    closeBtn.addEventListener('click', () => {
      if (closeBtn.disabled) return;
      adContainer.classList.add('hidden');
      adContainer.setAttribute('aria-hidden', 'true');
      // Schedule reappearance without removing or reloading iframe
      setTimeout(showAd, reappearDelay);
    });
  })();
</script>
</body>
